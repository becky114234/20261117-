# 應用程式名稱。
spring.application.name=backend
# 可透過環境變數覆寫資料庫連線設定；冒號後面是預設值。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tetris?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.username=${DB_USERNAME:tetris}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}
spring.jpa.hibernate.ddl-auto=update
# 啟動時先建立 JPA，再執行 SQL 初始化檔案。
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# 允許容器或區域網路上的瀏覽器連線到服務。
server.address=0.0.0.0
