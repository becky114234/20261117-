<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061522"/>
      <stop offset="1" stop-color="#02070d"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#55d8ff"/>
      <stop offset="1" stop-color="#ffc83d"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#19384b" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#55d8ff"/>
    </marker>
    <style>
      .title { font: 900 38px 'Noto Sans TC', sans-serif; fill: #e8f7ff; }
      .subtitle { font: 500 15px 'Noto Sans TC', sans-serif; fill: #8da7b8; }
      .section { font: 700 18px 'Noto Sans TC', sans-serif; fill: #55d8ff; }
      .body { font: 500 15px 'Noto Sans TC', sans-serif; fill: #c8dbe5; }
      .small { font: 500 13px 'Noto Sans TC', sans-serif; fill: #8da7b8; }
      .card { fill: #071a2a; stroke: #194866; stroke-width: 2; }
      .accent { stroke: #ffc83d; stroke-width: 4; }
    </style>
  </defs>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="712" rx="8" fill="url(#grid)" opacity=".36"/>
  <text x="60" y="78" class="title">俄羅斯方塊｜開發企劃書總覽</text>
  <text x="62" y="108" class="subtitle">以瀏覽器直接遊玩的 Canvas 俄羅斯方塊 MVP</text>
  <line x1="60" y1="132" x2="1140" y2="132" stroke="url(#hero)" stroke-width="3"/>

  <rect x="60" y="166" width="300" height="210" rx="6" class="card"/>
  <line x1="60" y1="166" x2="360" y2="166" class="accent"/>
  <text x="84" y="207" class="section">01｜專案目標</text>
  <text x="84" y="246" class="body">• 建立可遊玩的俄羅斯方塊</text>
  <text x="84" y="276" class="body">• 操作簡單，支援手機與桌面</text>
  <text x="84" y="306" class="body">• 保留經典玩法與即時回饋</text>
  <text x="84" y="336" class="body">• 具備未來排行榜擴充空間</text>

  <rect x="450" y="166" width="300" height="210" rx="6" class="card"/>
  <line x1="450" y1="166" x2="750" y2="166" stroke="#bd6cff" stroke-width="4"/>
  <text x="474" y="207" class="section">02｜核心玩法</text>
  <text x="474" y="246" class="body">• 七種方塊隨機生成</text>
  <text x="474" y="276" class="body">• 左右移動與順時針旋轉</text>
  <text x="474" y="306" class="body">• 下落、碰撞與直接落底</text>
  <text x="474" y="336" class="body">• 消行、計分、升級與 Game Over</text>

  <rect x="840" y="166" width="300" height="210" rx="6" class="card"/>
  <line x1="840" y1="166" x2="1140" y2="166" stroke="#76d64b" stroke-width="4"/>
  <text x="864" y="207" class="section">03｜技術架構</text>
  <text x="864" y="246" class="body">• Spring Boot 3.5.16</text>
  <text x="864" y="276" class="body">• 原生 HTML / CSS / JavaScript</text>
  <text x="864" y="306" class="body">• Canvas 10 × 17 棋盤</text>
  <text x="864" y="336" class="body">• H2 記憶體資料庫與 JPA 預留</text>

  <path d="M360 272 H438" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M750 272 H828" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="60" y="430" width="520" height="220" rx="6" class="card"/>
  <line x1="60" y1="430" x2="580" y2="430" stroke="#4ddfff" stroke-width="4"/>
  <text x="84" y="471" class="section">04｜玩家操作流程</text>
  <circle cx="112" cy="530" r="28" fill="#0b263a" stroke="#55d8ff" stroke-width="2"/>
  <text x="102" y="538" class="body">開始</text>
  <path d="M142 530 H192" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="222" cy="530" r="28" fill="#0b263a" stroke="#55d8ff" stroke-width="2"/>
  <text x="207" y="538" class="body">移動</text>
  <path d="M252 530 H302" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="332" cy="530" r="28" fill="#0b263a" stroke="#55d8ff" stroke-width="2"/>
  <text x="317" y="538" class="body">旋轉</text>
  <path d="M362 530 H412" stroke="#55d8ff" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="442" cy="530" r="28" fill="#0b263a" stroke="#ffc83d" stroke-width="2"/>
  <text x="427" y="538" class="body">消行</text>
  <text x="84" y="606" class="small">鍵盤：← → ↓ ↑ / X / Space / P / R　｜　手機：畫面按鈕</text>

  <rect x="620" y="430" width="520" height="220" rx="6" class="card"/>
  <line x1="620" y1="430" x2="1140" y2="430" stroke="#ff6874" stroke-width="4"/>
  <text x="644" y="471" class="section">05｜產品狀態與未來擴充</text>
  <text x="644" y="510" class="body">目前完成：可遊玩 MVP、響應式介面、即時分數與下一塊預覽</text>
  <text x="644" y="545" class="body">後續規劃：登入註冊、分數儲存、排行榜與遊戲紀錄</text>
  <text x="644" y="580" class="body">部署方式：本機 8080、區域網路，或雲端正式部署</text>
  <text x="644" y="615" class="small">驗證：Maven 測試通過，JavaScript 語法檢查通過</text>

  <text x="60" y="700" class="small">PROJECT STATUS / BROWSER GAME MVP / 2026</text>
  <text x="1140" y="700" text-anchor="end" class="small">TETRIS BACKEND</text>
</svg>
